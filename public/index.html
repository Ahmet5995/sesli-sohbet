<style>
:root{--bg:#121214;--side:#000;--card:#26231f;--text:#f4efe6;--mute:#a39a8c;--acc:#ffc001;--bad:#d93a1f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif}
aside{width:260px;background:var(--side);display:flex;flex-direction:column;flex-shrink:0}
h1{font-size:20px;letter-spacing:.12em;margin:0;padding:16px;display:flex;align-items:center;gap:12px;color:var(--acc);border-bottom:1px solid #2a2118}
h1 img{width:44px;height:44px;display:block}
.big{width:81px;height:81px;display:block;margin:0 auto 18px}
#channels{flex:1;overflow:auto;padding:0 8px}
.ch{margin-bottom:6px}
.chhead{display:flex;align-items:center;gap:4px}
.ch.over{outline:2px dashed var(--acc);border-radius:8px}
.m[draggable=true]{cursor:grab}
.ch .chhead>button:first-child{width:100%;text-align:left;background:none;border:0;color:var(--mute);padding:8px;border-radius:8px;font:inherit;cursor:pointer}
.ch .chhead>button:first-child:hover{background:var(--card);color:var(--text)}
.ch.on .chhead>button:first-child{color:var(--acc);font-weight:600}
.m{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 20px;color:var(--text)}
.av{width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:600;outline:2px solid transparent;transition:outline-color .1s}
.m.speak .av{outline-color:var(--acc)}
.tag{color:var(--acc);font-weight:600;font-size:12px}
#auth,#pwm{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;place-items:center;z-index:10;padding:16px}
#auth .box,#pwm .box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#auth h2,#pwm h2{margin:0 0 6px;color:var(--acc);letter-spacing:.1em;text-align:center}
#auth input,#pwm input{background:var(--card);border:1px solid transparent;color:var(--text);padding:10px;border-radius:8px;font:inherit}
#auth .row button,#pwm .row button{padding:10px}
#aerr,#perr{color:var(--bad);min-height:1.4em;font-size:14px;text-align:center}
.volrow{flex-basis:100%;display:flex;align-items:center;gap:6px;padding-left:34px}
.volrow input{flex:1;min-width:0;accent-color:var(--acc)}
.volrow span{font-size:11px;color:var(--mute);width:34px}
.panel details{font-size:13px;color:var(--mute)}
.panel summary{cursor:pointer;padding:2px 0}
.set{display:flex;flex-direction:column;gap:8px;padding-top:8px;color:var(--text)}
.set label{display:flex;align-items:center;gap:8px}
.panel input[type=range]{padding:0;width:100%;accent-color:var(--acc);background:none}
.panel input[type=checkbox]{width:auto;padding:0;accent-color:var(--acc)}
.panel{padding:12px;background:#0a0a0a;display:flex;flex-direction:column;gap:8px}
.panel input{background:var(--card);border:1px solid transparent;color:var(--text);padding:8px;border-radius:8px;font:inherit}
.row{display:flex;gap:6px}
.m{flex-wrap:wrap}.act{font:11px system-ui,sans-serif;padding:2px 6px;margin-left:4px;border:0;border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}.act:hover{background:var(--bad)}
.row button{flex:1;padding:8px;border:0;border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.row button.off{background:var(--bad)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#top{text-align:center;padding:24px;margin:auto 0}
#top.in{margin:0;padding:12px 16px;border-bottom:1px solid #2a2118}
#top.in .big{display:none}
#top.in #status{font-size:16px;max-width:none}
#chat{display:none;flex:1;flex-direction:column;min-height:0}
#msgs{flex:1;overflow:auto;padding:12px 16px;text-align:left}
.msg{margin:4px 0;word-break:break-word}
.msg b{color:var(--acc)}
.msg time{color:var(--mute);font-size:11px;margin-left:8px}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid #2a2118}
.send input{flex:1;background:var(--card);border:1px solid transparent;color:var(--text);padding:10px;border-radius:8px;font:inherit}
.send button{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:#111;font:inherit;font-weight:600;cursor:pointer}
#status{font-size:20px;max-width:30ch}
#status small{display:block;margin-top:8px;font-size:14px;color:var(--mute)}
#mem{width:220px;background:var(--side);overflow:auto;flex-shrink:0;border-left:1px solid #2a2118;padding-bottom:16px}
.mh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:14px 12px 6px}
.mr{display:flex;align-items:center;gap:8px;padding:4px 12px}
.mr.off{opacity:.45}
.mw{display:flex;flex-direction:column;min-width:0;flex:1}
.mw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw small{color:var(--mute);font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;margin-left:auto;flex-shrink:0}
.dot.on{background:#3ecf6e}
@media(max-width:900px){#mem{display:none}}
@media(max-width:640px){body{flex-direction:column-reverse}aside{width:100%;height:60%}}
</style>
</head>

  <h2>20VER</h2>
  <input id="au" placeholder="Kullanıcı adı" maxlength="16" autocomplete="username">
  <input id="ap" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
  <input id="ak" type="password" placeholder="Yönetici şifresi (varsa)">
  <div class="row"><button id="bl">Giriş yap</button><button id="br">Kayıt ol</button></div>

</div></div>

<script>
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let ws, myId, current = null, roster = {}, localStream = null;
const peers = new Map(); // id -> { pc, audio }
let muted = false, deafened = false, forced = false, myRole = 'user';
const $ = id => document.getElementById(id);
let myName = '', token = '', wantChannel = null, replaced = false;
let sendStream = null, micGain = null, micSrc = null;
let prefs = {}, vols = {};
let chNames = {}, dragId = null, members = [];
try { prefs = JSON.parse(localStorage.getItem('prefs') || '{}'); vols = JSON.parse(localStorage.getItem('vols') || '{}'); } catch {}
let ptt = !!prefs.ptt, pttKey = prefs.key || 'KeyV', pttDown = false, pttSetting = false;
let micVol = typeof prefs.mic === 'number' ? prefs.mic : 1;
try { token = localStorage.getItem('tok') || ''; } catch {}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = async e => {
    const m = JSON.parse(e.data);
    if (m.type === 'hello') { myId = m.id; roster = m.roster; chNames = m.names || {}; render(); if (token) ws.send(JSON.stringify({ type: 'auth', token })); else showAuth(); }
    else if (m.type === 'roster') { notify(m.roster); roster = m.roster; render(); }
    else if (m.type === 'joined') { for (const id of m.peers) await callPeer(id); }
    else if (m.type === 'peer-left') closePeer(m.id);
    else if (m.type === 'history') { $('msgs').innerHTML = ''; m.messages.forEach(addMsg); }
    else if (m.type === 'chat') addMsg(m.msg);
    else if (m.type === 'authed') {
      myName = m.name; myRole = m.role;
      $('me').textContent = myName + (myRole === 'admin' ? ' ★' : myRole === 'mod' ? ' ◆' : '');
      $('auth').style.display = 'none'; render();
      if (wantChannel) { const c = wantChannel; wantChannel = null; join(c); }
    }
    else if (m.type === 'auth-fail') { token = ''; try { localStorage.removeItem('tok'); } catch {} showAuth(m.reason || 'Oturum süresi doldu, tekrar giriş yap.'); }
    else if (m.type === 'replaced') replaced = true;
    else if (m.type === 'channels') { chNames = m.names; render(); renderMembers(); }
    else if (m.type === 'members') { members = m.list; renderMembers(); }
    else if (m.type === 'msgdel') { const el = document.querySelector('#msgs [data-id="' + m.id + '"]'); if (el) el.remove(); }
    else if (m.type === 'pwreset') alert(m.name + ' için yeni geçici şifre:\n\n' + m.password + '\n\nBunu kullanıcıya ilet. Girdikten sonra "Şifre değiştir" ile kendi şifresini belirleyebilir.');
    else if (m.type === 'banned') { replaced = true; token = ''; try { localStorage.removeItem('tok'); } catch {} showAuth('Bu hesap yasaklandı.'); }
    else if (m.type === 'moved') {
      const to = m.channel;
      join(to).then(() => { $('status').innerHTML = '#' + (chNames[to] || to) + '<small>' + (m.afk ? m.afk + ' dakika hareketsiz kaldığın için AFK kanalına taşındın. Mikrofonun kapalı; geri dönmek için hareket et.' : m.removed ? 'Bulunduğun kanal silindi, bu kanala taşındın.' : m.back ? 'Geri döndün, önceki kanalına taşındın.' : 'Yönetici seni bu kanala taşıdı.') + '</small>'; });
    }
    else if (m.type === 'role') { myRole = m.role; render(); }
    else if (m.type === 'notice') { $('status').innerHTML = m.text; }
    else if (m.type === 'kicked') { leave(); $('status').innerHTML = 'Yönetici seni kanaldan çıkardı.'; }
    else if (m.type === 'force-mute') setMute(m.on, m.on);
    else if (m.type === 'signal') await onSignal(m.from, m.data);
  };
  ws.onclose = () => {
    if (replaced) { closeAll(); current = null; $('status').innerHTML = 'Hesabınla başka bir yerden giriş yapıldı.<small>Burada devam etmek için sayfayı yenile.</small>'; return; }
    if (current) wantChannel = current;
    $('status').innerHTML = 'Bağlantı koptu. Yeniden bağlanıyor…'; closeAll(); current = null; prevIds = null;
    setTimeout(connect, 2000);
  };
}
const sig = (to, data) => ws.send(JSON.stringify({ type: 'signal', to, data }));

function makePeer(id) {
  const pc = new RTCPeerConnection(ICE);
  const audio = new Audio(); audio.autoplay = true; audio.muted = deafened;
  sendStream.getTracks().forEach(t => pc.addTrack(t, sendStream));
  pc.onicecandidate = e => e.candidate && sig(id, { candidate: e.candidate });
  pc.ontrack = e => {
    const st = e.streams[0];
    audio.srcObject = st; audio.muted = true; // ses WebAudio üzerinden çalınıyor (kişi başı seviye için)
    const src = ac.createMediaStreamSource(st), g = ac.createGain();
    src.connect(g); g.connect(ac.destination);
    const p = peers.get(id); if (p) { p.gain = g; applyVol(id); }
    watch(st, id);
  };
  peers.set(id, { pc, audio });
  return pc;
}
async function callPeer(id) {
  const pc = makePeer(id);
  await pc.setLocalDescription(await pc.createOffer());
  sig(id, { sdp: pc.localDescription });
}
async function onSignal(from, d) {
  if (!sendStream) return;
  let p = peers.get(from);
  if (d.sdp) {
    if (d.sdp.type === 'offer') {
      const pc = p ? p.pc : makePeer(from);
      await pc.setRemoteDescription(d.sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      sig(from, { sdp: pc.localDescription });
    } else if (p) await p.pc.setRemoteDescription(d.sdp);
  } else if (d.candidate && p) { try { await p.pc.addIceCandidate(d.candidate); } catch {} }
}
function closePeer(id) {
  const p = peers.get(id); if (!p) return;
  p.pc.close(); p.audio.srcObject = null; try { p.gain && p.gain.disconnect(); } catch {} peers.delete(id);
}
function closeAll() { [...peers.keys()].forEach(closePeer); }

// Konuşma algılama: ses seviyesi eşiği geçince halka yanar
const ac = new (window.AudioContext || window.webkitAudioContext)();
function watch(stream, id) {
  const an = ac.createAnalyser(); an.fftSize = 512;
  ac.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  const tick = () => {
    if (id !== 'me' && !peers.has(id)) return;
    if (id === 'me' && !localStream) return;
    an.getByteTimeDomainData(buf);
    let s = 0; for (const v of buf) s += (v - 128) ** 2;
    const on = Math.sqrt(s / buf.length) > 15 && !(id === 'me' && muted);
    if (on && id === 'me') markActive();
    const el = document.querySelector(`[data-id="${id === 'me' ? myId : id}"]`);
    if (el) el.classList.toggle('speak', on);
    requestAnimationFrame(tick);
  };
  tick();
}

async function join(channel) {
  if (!myName) { showAuth(); return; }
  if (current === channel) return;
  if (!localStream) {
    try { localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch { $('status').innerHTML = 'Mikrofona erişilemedi.<small>Tarayıcıdan mikrofon iznini aç. Adres https veya localhost olmalı.</small>'; return; }
    applyMic();
  }
  await ac.resume();
  if (!sendStream) buildMic();
  closeAll(); current = channel; prevIds = null;
  applyMic();
  ws.send(JSON.stringify({ type: 'join', channel }));
  sendState();
  watch(localStream, 'me');
  $('leave').style.display = 'block';
  $('status').innerHTML = `#${chNames[channel] || channel}<small>${channel === 'AFK' ? 'AFK kanalındasın, mikrofonun kapalı.' : 'Bağlısın. Konuştuğunda adının yanındaki halka yanar.'}</small>`;
}
function leave() {
  ws.send(JSON.stringify({ type: 'leave' }));
  closeAll(); current = null; prevIds = null;
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  try { micSrc && micSrc.disconnect(); micGain && micGain.disconnect(); } catch {} sendStream = null;
  $('leave').style.display = 'none';
  $('status').innerHTML = 'Bir ses kanalına tıklayarak katıl.';
}

let prevIds = null;
function beep(up) {
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'sine';
  o.frequency.setValueAtTime(up ? 520 : 440, t);
  o.frequency.setValueAtTime(up ? 780 : 300, t + 0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.15, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + 0.25);
}
function notify(newRoster) {
  if (!current) return;
  const ids = (newRoster[current] || []).map(u => u.id);
  if (prevIds && !deafened) {
    if (ids.some(id => id !== myId && !prevIds.includes(id))) beep(true);
    if (prevIds.some(id => id !== myId && !ids.includes(id))) beep(false);
  }
  prevIds = ids;
}
function sendState() {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'state', muted, deaf: deafened }));
}
function addMsg(g) {
  const box = $('msgs'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const d = document.createElement('div'); d.className = 'msg';
  const who = document.createElement('b');
  who.textContent = (g.tag ? '[' + g.tag + '] ' : '') + g.name + (g.role === 'admin' ? ' ★' : g.role === 'mod' ? ' ◆' : '') + ': ';
  const t = document.createElement('span'); t.textContent = g.text;
  const tm = document.createElement('time');
  tm.textContent = new Date(g.time).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  if (g.id) d.dataset.id = g.id;
  d.append(who, t, tm);
  if (myRole === 'admin' && g.id) {
    const x = document.createElement('button'); x.className = 'act'; x.textContent = 'Sil'; x.style.marginLeft = '8px';
    x.onclick = () => ws.send(JSON.stringify({ type: 'delmsg', id: g.id }));
    d.appendChild(x);
  }
  box.appendChild(d);
  if (near) box.scrollTop = box.scrollHeight;
}
function sendMsg() {
  const i = $('msg'), v = i.value.trim();
  if (!v || !current) return;
  ws.send(JSON.stringify({ type: 'chat', text: v })); i.value = '';
}
function render() {
  $('top').classList.toggle('in', !!current);
  peers.forEach((p, id) => applyVol(id));
  $('chat').style.display = current ? 'flex' : 'none';
  const box = $('channels'); box.innerHTML = '';
  for (const [ch, list] of Object.entries(roster)) {
    const d = document.createElement('div');
    d.className = 'ch' + (ch === current ? ' on' : '');
    d.ondragover = e => { if (dragId !== null) { e.preventDefault(); d.classList.add('over'); } };
    d.ondragleave = e => { if (!d.contains(e.relatedTarget)) d.classList.remove('over'); };
    d.ondrop = e => {
      e.preventDefault(); d.classList.remove('over');
      if (dragId !== null) ws.send(JSON.stringify({ type: 'mod', action: 'move', target: dragId, channel: ch }));
      dragId = null;
    };
    const head = document.createElement('div'); head.className = 'chhead';
    const b = document.createElement('button'); b.textContent = '🔊 ' + (chNames[ch] || ch); b.onclick = () => join(ch);
    head.appendChild(b);
    if (myRole === 'admin') {
      const ed = document.createElement('button'); ed.className = 'act'; ed.textContent = '✎'; ed.title = 'Kanal adını değiştir';
      ed.onclick = () => {
        const n = prompt('Yeni kanal adı (en fazla 20 karakter):', chNames[ch] || ch);
        if (n && n.trim()) ws.send(JSON.stringify({ type: 'rename', channel: ch, name: n }));
      };
      head.appendChild(ed);
      if (ch !== 'AFK') {
        const del = document.createElement('button'); del.className = 'act'; del.textContent = '🗑'; del.title = 'Kanalı sil';
        del.onclick = () => { if (confirm('"' + (chNames[ch] || ch) + '" kanalı ve tüm mesajları silinsin mi?')) ws.send(JSON.stringify({ type: 'chdelete', channel: ch })); };
        head.appendChild(del);
      }
    }
    d.appendChild(head);
    for (const u of list) {
      const r = document.createElement('div'); r.className = 'm'; r.dataset.id = u.id;
      if (myRole === 'admin' && u.id !== myId && u.role !== 'admin') {
        r.draggable = true;
        r.ondragstart = e => { dragId = u.id; e.dataTransfer.setData('text/plain', String(u.id)); e.dataTransfer.effectAllowed = 'move'; };
        r.ondragend = () => { dragId = null; document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); };
      }
      const a = document.createElement('span'); a.className = 'av'; a.textContent = u.name[0].toUpperCase();
      const n = document.createElement('span'); n.textContent = u.name + (u.id === myId ? ' (sen)' : '');
      n.textContent += u.role === 'admin' ? ' ★' : u.role === 'mod' ? ' ◆' : '';
      n.textContent += (u.muted ? ' 🔇' : '') + (u.deaf ? ' 🙉' : '');
      if (u.tag) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = '[' + u.tag + ']'; r.append(a, tg, n); } else r.append(a, n);
      const rk = { user: 0, mod: 1, admin: 2 };
      if (u.id !== myId && ch === current && rk[myRole] >= 1 && rk[myRole] > rk[u.role]) {
        const act = (txt, action) => {
          const x = document.createElement('button'); x.textContent = txt; x.className = 'act';
          x.onclick = () => ws.send(JSON.stringify({ type: 'mod', action, target: u.id }));
          r.appendChild(x);
        };
        act('Sustur', 'mute'); act('Aç', 'unmute'); act('At', 'kick');
        if (myRole === 'admin') act(u.role === 'mod' ? 'Modu al' : 'Mod yap', u.role === 'mod' ? 'demote' : 'promote');
      }
      if (myRole === 'admin' && ch === current) {
        const x = document.createElement('button'); x.textContent = 'Etiket'; x.className = 'act';
        x.onclick = () => {
          const t = prompt('Etiket yaz (en fazla 12 karakter, silmek için boş bırak):', u.tag || '');
          if (t !== null) ws.send(JSON.stringify({ type: 'mod', action: 'tag', target: u.id, tag: t }));
        };
        r.appendChild(x);
      }
      if (myRole === 'admin' && u.id !== myId && u.role !== 'admin') {
        const mv = document.createElement('button'); mv.className = 'act'; mv.textContent = 'Taşı'; mv.title = 'Başka kanala taşı (sürükleyip de bırakabilirsin)';
        mv.onclick = () => {
          const ids = Object.keys(roster);
          const list = ids.map((id, i) => (i + 1) + ') ' + (chNames[id] || id)).join('\n');
          const n = parseInt(prompt('Hangi kanala taşınsın? Numara yaz:\n' + list), 10);
          if (ids[n - 1]) ws.send(JSON.stringify({ type: 'mod', action: 'move', target: u.id, channel: ids[n - 1] }));
        };
        r.appendChild(mv);
      }
      if (u.id !== myId && ch === current) {
        const s0 = getVol(u.name);
        const vr = document.createElement('div'); vr.className = 'volrow';
        const mb = document.createElement('button'); mb.className = 'act'; mb.textContent = s0.m ? '🔇' : '🔊'; mb.title = 'Bu kişiyi sadece senin için sustur';
        const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 200; sl.step = 5; sl.value = s0.v;
        const pc = document.createElement('span'); pc.textContent = s0.v + '%';
        mb.onclick = () => { setVol(u.name, { m: !getVol(u.name).m }); mb.textContent = getVol(u.name).m ? '🔇' : '🔊'; };
        sl.oninput = () => { setVol(u.name, { v: Number(sl.value) }); pc.textContent = sl.value + '%'; };
        vr.append(mb, sl, pc); r.appendChild(vr);
      }
      d.appendChild(r);
    }
    box.appendChild(d);
  }
  if (myRole === 'admin') {
    const add = document.createElement('button'); add.className = 'act'; add.textContent = '+ Kanal ekle'; add.style.margin = '8px';
    add.onclick = () => { const n = prompt('Yeni kanal adı (en fazla 20 karakter):'); if (n && n.trim()) ws.send(JSON.stringify({ type: 'chcreate', name: n })); };
    box.appendChild(add);
  }
}

function setMute(on, force) {
  muted = on; forced = !!force && on;
  applyMic();
  const b = $('mute');
  b.textContent = forced ? 'Yönetici susturdu' : muted ? 'Mikrofonu aç' : 'Mikrofonu kapat';
  b.classList.toggle('off', muted);
  sendState();
}
$('mute').onclick = () => { if (!forced) setMute(!muted, false); };
$('deaf').onclick = e => {
  deafened = !deafened;
  peers.forEach((p, id) => applyVol(id));
  e.target.textContent = deafened ? 'Sesi aç' : 'Sağırlaştır';
  e.target.classList.toggle('off', deafened);
  sendState();
};
$('leave').onclick = leave;
$('sendbtn').onclick = sendMsg;
$('msg').onkeydown = e => { if (e.key === 'Enter') sendMsg(); };
function buildMic() {
  micSrc = ac.createMediaStreamSource(localStream);
  micGain = ac.createGain(); micGain.gain.value = micVol;
  const dest = ac.createMediaStreamDestination();
  micSrc.connect(micGain); micGain.connect(dest);
  sendStream = dest.stream;
}
function applyMic() {
  if (localStream) localStream.getAudioTracks()[0].enabled = !muted && current !== 'AFK' && (!ptt || pttDown);
}
function getVol(name) { return vols[name] || { v: 100, m: false }; }
function applyVol(id) {
  const p = peers.get(id); if (!p || !p.gain) return;
  let name = null;
  for (const l of Object.values(roster)) for (const u of l) if (u.id === id) name = u.name;
  const s = name ? getVol(name) : { v: 100, m: false };
  p.gain.gain.value = deafened || s.m ? 0 : s.v / 100;
}
function setVol(name, patch) {
  vols[name] = { ...getVol(name), ...patch };
  try { localStorage.setItem('vols', JSON.stringify(vols)); } catch {}
  peers.forEach((p, id) => applyVol(id));
}
function savePrefs() { try { localStorage.setItem('prefs', JSON.stringify({ ptt, key: pttKey, mic: micVol })); } catch {} }
function keyLabel() { return 'Tuş: ' + (pttKey === 'Space' ? 'Boşluk' : pttKey.replace('Key', '').replace('Digit', '')) + ' (değiştir)'; }
$('pttOn').checked = ptt;
$('pttOn').onchange = e => { ptt = e.target.checked; pttDown = false; savePrefs(); applyMic(); };
$('pttKey').textContent = keyLabel();
$('pttKey').onclick = () => { pttSetting = true; $('pttKey').textContent = 'Bir tuşa bas…'; };
$('mic').value = Math.round(micVol * 100); $('micv').textContent = Math.round(micVol * 100) + '%';
$('mic').oninput = e => {
  micVol = Number(e.target.value) / 100; $('micv').textContent = e.target.value + '%';
  if (micGain) micGain.gain.value = micVol; savePrefs();
};
addEventListener('keydown', e => {
  if (pttSetting) { e.preventDefault(); pttKey = e.code; pttSetting = false; savePrefs(); $('pttKey').textContent = keyLabel(); return; }
  const tn = e.target.tagName;
  if (ptt && e.code === pttKey && tn !== 'INPUT' && tn !== 'TEXTAREA') { e.preventDefault(); if (!e.repeat) { pttDown = true; applyMic(); } }
});
addEventListener('keyup', e => { if (e.code === pttKey && pttDown) { pttDown = false; applyMic(); } });
addEventListener('blur', () => { if (pttDown) { pttDown = false; applyMic(); } });
function renderMembers() {
  const box = $('mem'); box.innerHTML = '';
  const rk = { admin: 2, mod: 1, user: 0 };
  const sorted = [...members].sort((a, b) => rk[b.role] - rk[a.role] || a.name.localeCompare(b.name, 'tr'));
  const sec = (title, list, on) => {
    if (!list.length) return;
    const h = document.createElement('div'); h.className = 'mh'; h.textContent = title + ' — ' + list.length; box.appendChild(h);
    for (const u of list) {
      const row = document.createElement('div'); row.className = 'mr' + (on ? '' : ' off');
      const av = document.createElement('span'); av.className = 'av'; av.textContent = u.name[0].toUpperCase();
      const wrap = document.createElement('span'); wrap.className = 'mw';
      const nm = document.createElement('span');
      nm.textContent = (u.tag ? '[' + u.tag + '] ' : '') + u.name + (u.role === 'admin' ? ' ★' : u.role === 'mod' ? ' ◆' : '');
      wrap.appendChild(nm);
      if (on && u.channel) { const c = document.createElement('small'); c.textContent = '🔊 ' + (chNames[u.channel] || u.channel); wrap.appendChild(c); }
      const dot = document.createElement('i'); dot.className = 'dot' + (on ? ' on' : '');
      row.append(av, wrap);
      if (myRole === 'admin' && u.role !== 'admin' && u.name !== myName) {
        const mk = (txt, title, fn) => { const x = document.createElement('button'); x.className = 'act'; x.textContent = txt; x.title = title; x.onclick = fn; row.appendChild(x); };
        if (u.banned) mk('✅', 'Yasağı kaldır', () => ws.send(JSON.stringify({ type: 'unban', uid: u.uid })));
        else {
          mk('🔑', 'Şifreyi sıfırla', () => { if (confirm(u.name + ' için yeni geçici şifre oluşturulsun mu?')) ws.send(JSON.stringify({ type: 'resetpw', uid: u.uid })); });
          mk('⛔', 'Yasakla', () => { if (confirm(u.name + ' yasaklansın mı? Hesabına girişi engellenir.')) ws.send(JSON.stringify({ type: 'ban', uid: u.uid })); });
        }
      }
      row.appendChild(dot); box.appendChild(row);
    }
  };
  sec('Çevrim içi', sorted.filter(u => u.online && !u.banned), true);
  sec('Çevrim dışı', sorted.filter(u => !u.online && !u.banned), false);
  sec('Yasaklı', sorted.filter(u => u.banned), false);
}
$('pwbtn').onclick = () => { $('po').value = ''; $('pn').value = ''; $('perr').textContent = ''; $('pwm').style.display = 'grid'; };
$('pcancel').onclick = () => { $('pwm').style.display = 'none'; };
$('pok').onclick = async () => {
  try {
    const r = await fetch('/api/password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, oldPassword: $('po').value, newPassword: $('pn').value }) });
    const d = await r.json();
    if (!r.ok) { $('perr').textContent = d.error || 'Bir hata oluştu.'; return; }
    $('pwm').style.display = 'none'; alert('Şifren değiştirildi.');
  } catch { $('perr').textContent = 'Sunucuya ulaşılamadı.'; }
};
let lastPing = 0;
function markActive() {
  const now = Date.now();
  if (now - lastPing < 30000 || !current || !ws || ws.readyState !== 1) return;
  lastPing = now; ws.send(JSON.stringify({ type: 'activity' }));
}
['mousemove', 'keydown', 'pointerdown', 'touchstart', 'wheel'].forEach(ev => addEventListener(ev, markActive, { passive: true }));
function showAuth(msg) { $('auth').style.display = 'grid'; $('aerr').textContent = msg || ''; }
async function doAuth(kind) {
  const body = { username: $('au').value.trim(), password: $('ap').value, key: $('ak').value };
  $('aerr').textContent = '';
  try {
    const r = await fetch('/api/' + kind, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { $('aerr').textContent = d.error || 'Bir hata oluştu.'; return; }
    token = d.token; try { localStorage.setItem('tok', token); } catch {}
    $('ap').value = ''; $('ak').value = '';
    ws.send(JSON.stringify({ type: 'auth', token }));
  } catch { $('aerr').textContent = 'Sunucuya ulaşılamadı. Biraz sonra tekrar dene.'; }
}
$('bl').onclick = () => doAuth('login');
$('br').onclick = () => doAuth('register');
['au', 'ap', 'ak'].forEach(id => ($(id).onkeydown = e => { if (e.key === 'Enter') doAuth('login'); }));
$('logout').onclick = () => { try { localStorage.removeItem('tok'); } catch {} location.reload(); };
connect();
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' })); }, 25000);
</script>
